name: Backend Continuous Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore Pipenv cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-backend-pipenv-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: ${{ runner.os }}-backend-pipenv-
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install dependencies
        run: pipenv sync --dev
      - name: Run lint
        run: pipenv run lint

  test:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Restore Pipenv cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-backend-pipenv-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: ${{ runner.os }}-backend-pipenv-
      - name: Install Pipenv
        run: python -m pip install pipenv
      - name: Install dependencies
        run: pipenv sync --dev
      - name: Run tests
        run: pipenv run test

  build:
    name: Build backend image
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: starter/backend
        run: docker build --tag mp-backend:${{ github.sha }} .

  report-failure:
    name: Report CI failure
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Write failure summary
        run: |
          echo "## Backend CI failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the failed lint, test, or build job." >> "$GITHUB_STEP_SUMMARY"
          exit 1
