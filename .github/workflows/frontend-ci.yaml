name: Frontend Continuous Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-frontend-npm-
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  test:
    name: Test frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-frontend-npm-
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
        env:
          CI: "true"

  build:
    name: Build frontend image
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-frontend-npm-
      - name: Install dependencies
        run: npm ci
      - name: Run tests before build
        run: npm run test
        env:
          CI: "true"
      - name: Build Docker image
        run: >-
          docker build
          --build-arg REACT_APP_MOVIE_API_URL=http://localhost:5000
          --tag mp-frontend:${{ github.sha }} .

  report-failure:
    name: Report CI failure
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Write failure summary
        run: |
          echo "## Frontend CI failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the failed lint, test, or build job." >> "$GITHUB_STEP_SUMMARY"
          exit 1
